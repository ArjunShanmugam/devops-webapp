name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify web application
        run: |
          test -f index.html
          echo "Web application build successful"

      - name: Send Slack notification
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="SUCCESS"
          else
            STATUS="FAILED"
          fi

          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"CI Pipeline: $STATUS | Repository: ${{ github.repository }} | Commit: ${{ github.sha }}\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
